workflows:
  agoradesk-workflow:
    name: AgoraDesk / LocalMonero Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - firebase_credentials   # must contain FIREBASE_TOKEN
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $FLUTTER_ROOT/.pub-cache

    scripts:
      - name: Install Firebase & FlutterFire CLIs
        script: |
          set -e
          npm install -g firebase-tools
          dart pub global activate flutterfire_cli
          # Ensure pub global binaries are on PATH for subsequent steps
          echo 'export PATH="$PATH:$HOME/.pub-cache/bin"' >> $CM_ENV

      - name: Verify Firebase authentication
        script: |
          set -e
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "❌ FIREBASE_TOKEN is not set. Add it to the 'firebase_credentials' env group in Codemagic."
            exit 1
          fi
          firebase projects:list --token "$FIREBASE_TOKEN"

      - name: Generate firebase_options for LocalMonero flavor
        script: |
          set -e
          flutterfire configure \
            --token="$FIREBASE_TOKEN" \
            --project=agoradesk-1357 \
            --out=lib/firebase_options_agoradesk.dart \
            --platforms=android,ios \
            --ios-bundle-id=com.yourapp.agoradesk \
            --android-package-name=com.yourapp.agoradesk \
            --yes

      - name: Generate firebase_options for AgoraDesk flavor
        script: |
          set -e
          flutterfire configure \
            --token="$FIREBASE_TOKEN" \
            --project=agoradesk-1357 \
            --out=lib/firebase_options_agoradesk.dart \
            --platforms=android,ios \
            --ios-bundle-id=com.yourapp.agoradesk \
            --android-package-name=com.yourapp.agoradesk \
            --yes

      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Flutter analyze (optional but recommended)
        script: flutter analyze --no-fatal-infos --no-fatal-warnings || true
        ignore_failure: true

      - name: Build Android AAB (AgoraDesk flavor)
        script: |
          set -e
          flutter build appbundle \
            --flavor agoradesk \
            --release

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - prioritybtc@gmail.com
        notify:
          success: true
          failure: true
