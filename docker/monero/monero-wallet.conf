# Monero Wallet RPC Configuration

# RPC settings
rpc-bind-ip=0.0.0.0
rpc-bind-port=18082
confirm-external-bind=1

# Wallet settings
wallet-file=wallet
password=CHANGE_THIS_TO_A_STRONG_PASSWORD

# Daemon connection
daemon-address=monero-daemon:18080
trusted-daemon=1

# Security
disable-rpc-login=0
rpc-login=monerorpc:CHANGE_THIS_TO_A_STRONG_PASSWORD

# Logging
log-level=0
