# Bitcoin Core Configuration for Development/Production
# Place this file in the Bitcoin data directory

# Network settings
testnet=0
regtest=0

# RPC settings
server=1
rpcuser=bitcoinrpc
rpcpassword=CHANGE_THIS_TO_A_STRONG_PASSWORD
rpcallowip=127.0.0.1
rpcallowip=172.0.0.0/8
rpcbind=0.0.0.0
rpcport=8332

# Wallet settings
wallet=wallet.dat
addresstype=bech32

# Performance
dbcache=450
maxconnections=40

# Logging
debug=rpc
debug=net

# Security
disablewallet=0
